<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>페이지를 찾을 수 없어요 · FotData</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a1020">
  <link rel="icon" sizes="192x192" href="/icon-192.png">
  <!-- 없는 주소로 들어오면 Vercel이 이 파일을 404 상태로 보여줌(2026-10-04 — 예전엔 영어 "NOT_FOUND" 기본 화면).
       어느 깊이의 주소에서든 열리므로 파일·링크는 전부 "/"로 시작하는 절대 경로 -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: #0a1020; color: #c5cedf; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; -webkit-text-size-adjust: 100%; word-break: keep-all; overflow-wrap: break-word; display: flex; flex-direction: column; }
    body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(ellipse 60% 50% at 82% 12%, rgba(88,166,255,0.14), transparent 70%), radial-gradient(ellipse 55% 45% at 8% 92%, rgba(163,113,247,0.08), transparent 70%); }
    body::after { content: ''; position: fixed; z-index: -1; pointer-events: none; width: min(70vw, 560px); aspect-ratio: 1; right: max(-18vw, -150px); bottom: max(-16vw, -130px); background: url('/bg-ball.svg') center / contain no-repeat; opacity: 0.22; }
    header { padding: 18px 20px; }
    .brand { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #ecf1fa; font-weight: 800; font-size: 19px; letter-spacing: -0.3px; }
    .brand b { color: #58a6ff; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 20px 64px; }
    .box { max-width: 440px; width: 100%; text-align: center; }
    .ball { width: 84px; height: 84px; margin: 0 auto 14px; animation: roll 2.4s cubic-bezier(.45,0,.3,1) infinite; }
    @keyframes roll { 0%, 55% { transform: rotate(0); } 85%, 100% { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .ball { animation: none; } }
    .code { font-size: 64px; font-weight: 800; letter-spacing: 2px; color: #ecf1fa; line-height: 1; margin: 0 0 12px; font-variant-numeric: tabular-nums; }
    .code span { color: #58a6ff; }
    h1 { font-size: 21px; color: #ecf1fa; margin: 0 0 10px; letter-spacing: -0.2px; }
    p { font-size: 14.5px; line-height: 1.7; color: #8e9ab3; margin: 0 0 26px; }
    .path { display: inline-block; max-width: 100%; margin-top: 6px; padding: 2px 8px; border-radius: 6px; background: rgba(142,154,179,0.12); color: #c5cedf; font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
    .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-width: 150px; padding: 12px 20px; border-radius: 12px; font-size: 14.5px; font-weight: 700; text-decoration: none; transition: transform .15s, background .15s, border-color .15s; }
    .btn.primary { background: #58a6ff; color: #0a1020; }
    .btn.primary:hover { background: #79b8ff; }
    .btn.ghost { color: #ecf1fa; border: 1px solid #26334d; background: rgba(17,26,46,0.7); }
    .btn.ghost:hover { border-color: #58a6ff; }
    .btn:active { transform: scale(.97); }
    .quick { margin-top: 30px; padding-top: 20px; border-top: 0.5px solid #18233a; }
    .quick-t { font-size: 12px; color: #7c88a1; margin-bottom: 10px; }
    .quick a { display: inline-block; margin: 3px 4px; padding: 6px 12px; border-radius: 99px; font-size: 13px; color: #c5cedf; text-decoration: none; border: 0.5px solid #26334d; background: rgba(17,26,46,0.6); }
    .quick a:hover { color: #58a6ff; border-color: rgba(88,166,255,0.5); }
    a:focus-visible { outline: 2px solid #58a6ff; outline-offset: 2px; }
    footer { padding: 18px 20px calc(18px + env(safe-area-inset-bottom)); text-align: center; font-size: 12px; color: #6e7681; }
    footer a { color: #8e9ab3; }
    @media (max-width: 480px) { .code { font-size: 54px; } .btn { min-width: 0; flex: 1 1 140px; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="FotData 홈">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polygon points="12,7.7 16.09,10.67 14.53,15.48 9.47,15.48 7.91,10.67"/><path d="M12 7.7L12 3.8M16.09 10.67L19.8 9.47M14.53 15.48L16.82 18.63M9.47 15.48L7.18 18.63M7.91 10.67L4.2 9.47"/></svg>
      <span>Fot<b>Data</b></span>
    </a>
  </header>
  <main>
    <div class="box">
      <svg class="ball" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polygon points="12,7.7 16.09,10.67 14.53,15.48 9.47,15.48 7.91,10.67"/><path d="M12 7.7L12 3.8M16.09 10.67L19.8 9.47M14.53 15.48L16.82 18.63M9.47 15.48L7.18 18.63M7.91 10.67L4.2 9.47"/></svg>
      <div class="code" aria-hidden="true">4<span>0</span>4</div>
      <h1>페이지를 찾을 수 없어요</h1>
      <p>주소가 바뀌었거나 없는 페이지예요.<br><span class="path" id="nf-path"></span></p>
      <div class="btns">
        <a class="btn primary" href="/app">경기 예측하러 가기</a>
        <a class="btn ghost" href="/">FotData 홈</a>
      </div>
      <div class="quick">
        <div class="quick-t">바로 가기</div>
        <a href="/app#standings">순위표</a><a href="/app#schedule">경기 일정</a><a href="/app#champion">순위 예측</a><a href="/app#players">선수 순위</a>
      </div>
    </div>
  </main>
  <footer>문제가 계속되면 <a href="mailto:fotdata.official@gmail.com">fotdata.official@gmail.com</a>으로 알려주세요</footer>
  <script>
    // 어떤 주소로 들어왔는지 보여줌(textContent라 주소에 태그가 섞여 있어도 그대로 글자로만 나옴)
    (function () {
      var el = document.getElementById('nf-path'), p = location.pathname + location.search;
      try { p = decodeURIComponent(p); } catch (e) {}   // 깨진 %인코딩이면 원래 글자 그대로
      if (el && p && p !== '/404' && p !== '/404.html') el.textContent = p; else if (el) el.remove();
    })();
  </script>
  <script src="/analytics.js" defer></script>
</body>
</html>
